# Default configuration for dance generation system

# Model configuration
model:
  model_type: "lstm"  # lstm, transformer, vae
  input_size: 10
  output_size: 10
  hidden_units: 128
  num_layers: 2
  dropout: 0.1
  sequence_length: 50
  latent_dim: 64  # for VAE models

# Data configuration
data:
  dataset_name: "synthetic"
  data_path: "data/"
  batch_size: 32
  num_workers: 4
  sequence_length: 50
  feature_dim: 10
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

# Training configuration
training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  precision: "16-mixed"  # 16-mixed, 32, bf16-mixed
  devices: 1
  accelerator: "auto"  # auto, gpu, cpu, mps
  deterministic: true
  seed: 42

# Evaluation configuration
evaluation:
  metrics: ["mse", "mae", "diversity"]
  save_samples: true
  num_samples: 100
  sample_frequency: 10  # epochs

# Paths
project_root: "."
assets_dir: "assets"
checkpoints_dir: "assets/checkpoints"
samples_dir: "assets/samples"
logs_dir: "assets/logs"

# Logging
log_level: "INFO"
log_to_file: true
log_to_wandb: false
wandb_project: "dance-generation"
