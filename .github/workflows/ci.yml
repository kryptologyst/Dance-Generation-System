name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/ tests/ scripts/
    
    - name: Format check with black
      run: |
        pip install black
        black --check src/ tests/ scripts/
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test model creation
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from src.models.models import create_model
        from src.configs.config import get_default_config
        
        config = get_default_config()
        for model_type in ['lstm', 'transformer', 'vae']:
            config.model.model_type = model_type
            model = create_model(config)
            print(f'{model_type} model created successfully')
        "
    
    - name: Test data pipeline
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from src.data.dataset import create_dance_data_module
        from src.configs.config import get_default_config
        
        config = get_default_config()
        data_module = create_dance_data_module(config)
        print('Data module created successfully')
        "
